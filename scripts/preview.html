<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page preview — desktop + phone</title>
<style>
  :root{--cream:#FAF8F4;--rule:#EFEAE0;--charcoal:#2A2A2A;--sub:#6E6E6A;--gold:#C9A961;--green:#1B4332}
  *{box-sizing:border-box}
  body{margin:0;background:#E9E6DF;font-family:system-ui,-apple-system,'Segoe UI',Inter,sans-serif;color:var(--charcoal);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{height:52px;background:#fff;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:14px;padding:0 18px;flex-shrink:0}
  header b{font-weight:600}
  header select{font:inherit;padding:6px 10px;border:1px solid var(--rule);border-radius:8px;background:#fff;max-width:420px}
  header .status{font-size:12px;color:var(--sub);margin-left:auto}
  header .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2e9e5b;margin-right:6px;vertical-align:middle}
  main{flex:1;display:flex;gap:18px;padding:18px;min-height:0}
  .pane{display:flex;flex-direction:column;min-height:0}
  .pane.desktop{flex:1}
  .pane.phone{width:407px;flex-shrink:0}
  .label{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--sub);margin:0 0 8px;display:flex;justify-content:space-between}
  .frame{flex:1;background:#fff;border:1px solid #d9d5cc;border-radius:12px;overflow:hidden;min-height:0;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .desktop .frame{position:relative}
  .desktop iframe{width:1280px;height:100%;border:0;transform-origin:0 0;position:absolute;left:0;top:0}
  .phone .frame{border-radius:36px;border:10px solid #1f1f1f;background:#1f1f1f;padding:0;width:395px;height:832px;max-height:100%;margin:0 auto;flex:none}
  .phone iframe{width:375px;height:100%;border:0;border-radius:26px;background:#fff;display:block}
  @media (max-width:980px){main{flex-direction:column;overflow:auto}.pane.phone{width:100%}.desktop .frame{height:600px;flex:none}}
</style>
</head>
<body>
<header>
  <b>Page preview</b>
  <select id="pick"></select>
  <span class="status"><span class="dot"></span><span id="st">watching for changes</span></span>
</header>
<main>
  <section class="pane desktop">
    <p class="label"><span>Desktop</span><span id="dw"></span></p>
    <div class="frame"><iframe id="d"></iframe></div>
  </section>
  <section class="pane phone">
    <p class="label"><span>Phone</span><span>375 × 812</span></p>
    <div class="frame"><iframe id="m"></iframe></div>
  </section>
</main>
<script>
  const PAGES = __PAGES__;
  const pick = document.getElementById('pick');
  const d = document.getElementById('d'), m = document.getElementById('m'), st = document.getElementById('st');
  const q = new URLSearchParams(location.search).get('p');
  let current = q || PAGES[0]?.path || '/';
  for (const p of PAGES) { const o = document.createElement('option'); o.value = p.path; o.textContent = p.title + '  —  ' + p.path; pick.appendChild(o); }
  if (!PAGES.some(p => p.path === current)) { const o = document.createElement('option'); o.value = current; o.textContent = current; pick.appendChild(o); }
  pick.value = current;
  function load() { const u = current + (current.includes('?') ? '&' : '?') + 't=' + Date.now(); d.src = u; m.src = u; history.replaceState(null, '', '?p=' + encodeURIComponent(current)); }
  pick.onchange = () => { current = pick.value; lastHtml = null; load(); };
  function fit() { const w = d.parentElement.clientWidth; const s = Math.min(1, w / 1280); d.style.transform = 'scale(' + s + ')'; d.style.height = (d.parentElement.clientHeight / s) + 'px'; document.getElementById('dw').textContent = '1280 px wide, shown at ' + Math.round(s * 100) + '%'; }
  window.addEventListener('resize', fit); fit();
  let lastHtml = null;
  async function poll() {
    try {
      const r = await fetch(current.split('?')[0], { cache: 'no-store' }); const h = await r.text();
      if (lastHtml !== null && h !== lastHtml) { st.textContent = 'updated ' + new Date().toLocaleTimeString(); load(); }
      lastHtml = h;
    } catch (e) { st.textContent = 'server not running'; }
  }
  load(); setInterval(poll, 1500);
</script>
</body>
</html>
